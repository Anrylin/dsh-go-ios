# Codemagic 上的 iOS 未签名包：编译全在 Codemagic 的 Mac 上跑，本机只推代码。
# 用法：Codemagic → Add application → 选这个仓库 → 它会读到本文件 → Start new build。
workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Node engine for the local option
        script: |
          # 只有带本机引擎的分支需要:iOS 跑不了可执行文件,只能用编进 App 的 Node 库。
          set +e
          {
            bash tooling/ios/fetch-node.sh
            echo "--- fetch exit: $? ---"
            ruby tooling/ios/add-node-framework.rb
            echo "--- link exit: $? ---"
          } 2>&1 | tee "$CM_BUILD_DIR/node.log"
          status=${PIPESTATUS[0]}
          tail -n 40 "$CM_BUILD_DIR/node.log"
          exit $status
      - name: Dependencies
        script: |
          cd app
          python3 tool/l10n_merge.py --no-gen
          flutter config --enable-swift-package-manager
          flutter pub get --enforce-lockfile
          flutter gen-l10n
      - name: Build (unsigned)
        script: |
          set +e
          cd app
          # Keep the compiler's own words: Codemagic's UI is the only place the
          # log lives, and this artifact survives a failed build.
          flutter build ios --release --no-codesign 2>&1 | tee "$CM_BUILD_DIR/build.log"
          status=${PIPESTATUS[0]}
          tail -n 150 "$CM_BUILD_DIR/build.log"
          exit $status
      - name: Package the IPA
        script: |
          set -e
          cd app
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP"
          rm -rf "$CM_BUILD_DIR/out" && mkdir -p "$CM_BUILD_DIR/out/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/out/Payload/"
          cd "$CM_BUILD_DIR/out"
          zip -qry "$CM_BUILD_DIR/dsh-go-ios-unsigned.ipa" Payload
          shasum -a 256 "$CM_BUILD_DIR/dsh-go-ios-unsigned.ipa" \
            > "$CM_BUILD_DIR/dsh-go-ios-unsigned.ipa.sha256"
          ls -lh "$CM_BUILD_DIR/dsh-go-ios-unsigned.ipa"
    artifacts:
      - node.log
      - build.log
      - dsh-go-ios-unsigned.ipa
      - dsh-go-ios-unsigned.ipa.sha256
